[project]
name = "djangorestframework-services"
dynamic = ["version"]
description = "A service-oriented layer for Django REST Framework: precise, controllable side effects for mutating endpoints."
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Artur Veres", email = "artur8118@gmail.com" },
]
readme = "README.md"
keywords = ["django", "djangorestframework", "drf", "services", "service-layer"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Framework :: Django :: 5.1",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
    "django>=4.2",
    "djangorestframework>=3.14",
    "djangorestframework-dataclasses>=1.3.1",
    # ``typing_extensions.Unpack`` is used at runtime in the strict
    # service / selector Protocols (PEP 692). Already required transitively
    # by ``djangorestframework-dataclasses``; declared here explicitly so we
    # don't depend on a transitive contract.
    "typing-extensions>=4.6",
]

[project.optional-dependencies]
# OpenAPI / Swagger via drf-spectacular. Pulled in only when the user
# installs the extra and calls ``rest_framework_services.openapi.enable_openapi``.
spectacular = ["drf-spectacular>=0.27,<1.0"]
# django-filter introspection for ``filterset_to_json_schema``. The core never
# imports django-filter (``SelectorSpec.filter_set`` is applied by duck typing);
# only the JSON Schema introspection of a ``FilterSet`` needs the real classes,
# so it lives behind this extra and imports lazily.
filter = ["django-filter>=23.0"]

[project.urls]
Homepage = "https://github.com/Artui/djangorestframework-services"
Repository = "https://github.com/Artui/djangorestframework-services"
Issues = "https://github.com/Artui/djangorestframework-services/issues"

[dependency-groups]
dev = [
    "ruff>=0.15.13",
    "ty>=0.0.32",
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "pytest-django>=4.12.0",
    "pytest-cov>=7.1.0",
    "pytest-asyncio>=1.3.0",
    "flake8-tidy-imports>=4.12.0",
    "django-stubs>=6.0.4",
    "djangorestframework-stubs>=3.17.0",
    "drf-spectacular>=0.29.0",
    "django-filter>=23.0",
]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.6",
    "mkdocstrings[python]>=1.0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "rest_framework_services/version.py"
pattern = "^__version__(?:\\s*:\\s*[A-Za-z][A-Za-z0-9_]*)?\\s*=\\s*[\"'](?P<version>[^\"']+)[\"']"

[tool.hatch.build.targets.wheel]
packages = ["rest_framework_services"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.conftest_settings"
asyncio_mode = "auto"
addopts = "--cov=rest_framework_services --cov-report=term-missing --cov-fail-under=100"

[tool.coverage.run]
source = ["rest_framework_services"]
branch = true

[tool.coverage.report]
fail_under = 100

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
    # flake8-tidy-imports
    "TID",
]
ignore = [
    "E203",
    "E501",
    "E231",
    "F811",
    "E722",
    "E741",
    # PEP 695 syntax. The package consistently uses ``TypeVar`` + ``Generic[T]``
    # and the explicit ``TypeAlias`` annotation, avoiding ``class C[T]:`` /
    # ``def f[T](...)`` / ``type Foo = ...`` — see the *Compatibility floor*
    # note in CLAUDE.md.
    "UP040",
    "UP046",
    "UP047",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["rest_framework_services"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ty.environment]
root = ["./rest_framework_services"]

# bump-my-version drives `make release-bump` — it rewrites the version in
# rest_framework_services/version.py (the single source of truth; hatchling
# picks it up at build time via [tool.hatch.version]) and promotes the
# CHANGELOG [Unreleased] block under a new dated heading. Run via
# `uvx bump-my-version` (no permanent dependency added to the project).
[tool.bumpversion]
current_version = "0.24.1"
allow_dirty = false
commit = false
tag = false

[[tool.bumpversion.files]]
filename = "rest_framework_services/version.py"
search = '__version__: str = "{current_version}"'
replace = '__version__: str = "{new_version}"'

[[tool.bumpversion.files]]
filename = "CHANGELOG.md"
search = "## [Unreleased]"
replace = """## [Unreleased]

## [{new_version}] — {now:%Y-%m-%d}"""

[[tool.bumpversion.files]]
filename = "CHANGELOG.md"
search = "[Unreleased]: https://github.com/Artui/djangorestframework-services/compare/v{current_version}...HEAD"
replace = """[Unreleased]: https://github.com/Artui/djangorestframework-services/compare/v{new_version}...HEAD
[{new_version}]: https://github.com/Artui/djangorestframework-services/compare/v{current_version}...v{new_version}"""
