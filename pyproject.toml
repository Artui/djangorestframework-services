[project]
name = "djangorestframework-services"
version = "0.5.0"
description = "A service-oriented layer for Django REST Framework: precise, controllable side effects for mutating endpoints."
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Artur Veres", email = "artur8118@gmail.com" },
]
readme = "README.md"
keywords = ["django", "djangorestframework", "drf", "services", "service-layer"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Framework :: Django :: 5.1",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
    "django>=4.2",
    "djangorestframework>=3.14",
    "djangorestframework-dataclasses>=1.3.1",
    # ``typing_extensions.Unpack`` is used at runtime in the strict
    # service / selector Protocols (PEP 692). Already required transitively
    # by ``djangorestframework-dataclasses``; declared here explicitly so we
    # don't depend on a transitive contract.
    "typing_extensions>=4.6",
]

[project.optional-dependencies]
# OpenAPI / Swagger via drf-spectacular. Pulled in only when the user
# installs the extra and calls ``rest_framework_services.openapi.enable_openapi``.
spectacular = ["drf-spectacular>=0.27,<1.0"]

[project.urls]
Homepage = "https://github.com/Artui/djangorestframework-services"
Repository = "https://github.com/Artui/djangorestframework-services"
Issues = "https://github.com/Artui/djangorestframework-services/issues"

[dependency-groups]
dev = [
    "ruff>=0.9.0",
    "ty>=0.0.32",
    "pre-commit>=3.8.0",
    "pytest>=8.0",
    "pytest-django>=4.11.1",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.24",
    "flake8-tidy-imports>=4.12.0",
    "django-stubs>=5.0",
    "djangorestframework-stubs>=3.15",
    "drf-spectacular>=0.27",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rest_framework_services"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.conftest_settings"
asyncio_mode = "auto"
addopts = "--cov=rest_framework_services --cov-report=term-missing --cov-fail-under=100"

[tool.coverage.run]
source = ["rest_framework_services"]
branch = true

[tool.coverage.report]
fail_under = 100

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
    # flake8-tidy-imports
    "TID",
]
ignore = [
    "E203",
    "E501",
    "E231",
    "F811",
    "E722",
    "E741",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["rest_framework_services"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ty.environment]
root = ["./rest_framework_services"]

# bump-my-version drives `make release-bump` — it rewrites the version in
# pyproject.toml + __init__.py and promotes the CHANGELOG [Unreleased]
# block under a new dated heading. Run via `uvx bump-my-version` (no
# permanent dependency added to the project).
[tool.bumpversion]
current_version = "0.5.0"
allow_dirty = false
commit = false
tag = false

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "rest_framework_services/__init__.py"
search = '__version__ = "{current_version}"'
replace = '__version__ = "{new_version}"'

[[tool.bumpversion.files]]
filename = "CHANGELOG.md"
search = "## [Unreleased]"
replace = """## [Unreleased]

## [{new_version}] — {now:%Y-%m-%d}"""

[[tool.bumpversion.files]]
filename = "CHANGELOG.md"
search = "[Unreleased]: https://github.com/Artui/djangorestframework-services/compare/v{current_version}...HEAD"
replace = """[Unreleased]: https://github.com/Artui/djangorestframework-services/compare/v{new_version}...HEAD
[{new_version}]: https://github.com/Artui/djangorestframework-services/compare/v{current_version}...v{new_version}"""
