name: tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install
        run: uv sync --all-groups
      - name: ruff check
        run: uv run ruff check .
      - name: ruff format check
        run: uv run ruff format --check --diff .
      - name: ty
        run: uv run ty check rest_framework_services
      - name: ty drift fixtures
        run: make type-check-strict-fixtures

  docs:
    name: docs build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install with docs group
        run: uv sync --all-groups
      - name: mkdocs build --strict
        # mkdocstrings imports the package, which transitively imports DRF;
        # DRF reads ``settings.REST_FRAMEWORK`` at import time, so we point at
        # the test settings module to keep the build hermetic.
        run: DJANGO_SETTINGS_MODULE=tests.conftest_settings uv run mkdocs build --strict

  test:
    name: ${{ matrix.python-version }} / Django ${{ matrix.django-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        django-version: ["4.2", "5.0", "5.1", "5.2", "6.0"]
        exclude:
          # Django 4.2 supports Python 3.8–3.12
          - python-version: "3.13"
            django-version: "4.2"
          - python-version: "3.14"
            django-version: "4.2"
          # Django 5.0 supports Python 3.10–3.12
          - python-version: "3.13"
            django-version: "5.0"
          - python-version: "3.14"
            django-version: "5.0"
          # Django 5.1 supports Python 3.10–3.13
          - python-version: "3.14"
            django-version: "5.1"
          # Django 6.0 requires Python 3.12+
          - python-version: "3.10"
            django-version: "6.0"
          - python-version: "3.11"
            django-version: "6.0"

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Sync dev deps
        run: uv sync --all-groups --python ${{ matrix.python-version }}
      - name: Pin Django ${{ matrix.django-version }}
        run: uv pip install --reinstall-package django "django~=${{ matrix.django-version }}.0"
      - name: pytest
        run: |
          uv run --no-sync pytest \
            --cov-report=xml:coverage.xml \
            --cov-report=html:htmlcov
      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-py${{ matrix.python-version }}-django${{ matrix.django-version }}
          path: |
            coverage.xml
            htmlcov/
          if-no-files-found: ignore
